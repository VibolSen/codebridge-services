services:
  # 1. API Gateway (Nginx Reverse Proxy)
  api-gateway:
    image: nginx:alpine
    container_name: codebridge-api-gateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - inventory-service
      - sales-service
    networks:
      - pos-network

  # 2. Auth & Identity Service (Port 8001 - Identity, Tenants, Users, RBAC, CRM, Employees, Outlets)
  auth-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.php
    container_name: pos-auth-service
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    ports:
      - "8001:8000"
    volumes:
      - ./auth-service:/var/www/html
    environment:
      - APP_NAME="POS Auth Service"
      - APP_ENV=local
      - APP_DEBUG=true
      - PHP_CLI_SERVER_WORKERS=4
      - DB_CONNECTION=mysql
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_DATABASE=codebridge
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
    depends_on:
      - mysql-db
    networks:
      - pos-network

  # 3. Inventory & Catalog Service (Port 8003 - Products, Categories, Brands, Coupons, Balances, Transfers, POs)
  inventory-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.php
    container_name: pos-inventory-service
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    ports:
      - "8003:8000"
    volumes:
      - ./inventory-service:/var/www/html
    environment:
      - APP_NAME="POS Inventory Service"
      - APP_ENV=local
      - APP_DEBUG=true
      - PHP_CLI_SERVER_WORKERS=4
      - DB_CONNECTION=mysql
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_DATABASE=codebridge
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
    depends_on:
      - mysql-db
    networks:
      - pos-network

  # 4. Sales, Shift & Payment Engine (Port 8006 - POS Terminal, Checkout, Shifts, KHQR Payments, Reconciliation, Finance)
  sales-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.php
    container_name: pos-sales-service
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    ports:
      - "8006:8000"
    volumes:
      - ./sales-service:/var/www/html
    environment:
      - APP_NAME="POS Sales Service"
      - APP_ENV=local
      - APP_DEBUG=true
      - PHP_CLI_SERVER_WORKERS=4
      - DB_CONNECTION=mysql
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_DATABASE=codebridge
      - DB_USERNAME=root
      - DB_PASSWORD=root_password
    depends_on:
      - mysql-db
    networks:
      - pos-network

  # 5. Central MySQL 8 Database Server
  mysql-db:
    image: mysql:8.0
    container_name: codebridge-mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - pos-mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    networks:
      - pos-network

networks:
  pos-network:
    driver: bridge

volumes:
  pos-mysql-data:
